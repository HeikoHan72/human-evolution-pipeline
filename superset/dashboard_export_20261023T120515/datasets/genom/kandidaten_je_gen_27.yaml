catalog: genom
schema: public
sql: 'SELECT g.gen, g.region, COUNT(k.pos) AS kandidaten

  FROM gene g

  LEFT JOIN kandidaten k ON k.chrom = g.chrom AND k.pos BETWEEN g.start_pos AND g.ende_pos

  GROUP BY g.gen, g.region

  ORDER BY g.region, g.gen;'
